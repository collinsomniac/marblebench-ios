name: Deploy experimental Modular Garden preview
on:
  push:
    branches: [feature/modular-garden-v2]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned engine versions
        working-directory: experiments/modular-garden
        run: npm install --no-audit --no-fund
      - name: Gate preview on physics and browser-module syntax
        working-directory: experiments/modular-garden
        run: npm run check
      - name: Build modular garden for the repository subpath
        working-directory: experiments/modular-garden
        run: npm run build
      - name: Install experimental build alongside existing 2D and 3D pages
        run: |
          mkdir -p site/modular
          cp -R experiments/modular-garden/dist/. site/modular/
          test -s site/index.html
          test -s site/3d/index.html
          test -s site/modular/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
