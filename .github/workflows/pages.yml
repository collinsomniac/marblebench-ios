name: Deploy MarbleBench iOS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript module syntax
        run: |
          node --check site/3d/main.js
          node --check site/3d/physics.js
          node --check site/3d/render.js
      - name: Validate frame pacing diagnostic
        run: node tests/test_diagnostics.mjs
      - name: Run deterministic 3D physics regression
        run: node tests/test_3d.mjs
      - name: Verify standalone and PWEB builds
        run: python3 tools/build_3d.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
