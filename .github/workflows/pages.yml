name: Deploy MarbleBench iOS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check existing 3D JavaScript module syntax
        run: |
          node --check site/3d/main.js
          node --check site/3d/physics.js
          node --check site/3d/render.js
      - name: Validate frame pacing diagnostic
        run: node tests/test_diagnostics.mjs
      - name: Validate quiet-water presentation
        run: node tests/test_presentation.mjs
      - name: Run original deterministic 3D physics regression
        run: node tests/test_3d.mjs
      - name: Verify original standalone and PWEB builds
        run: python3 tools/build_3d.py
      - name: Check out separate experimental branch without merging into main
        uses: actions/checkout@v4
        with:
          ref: feature/modular-garden-v2
          path: modular-preview-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install modular experiment dependencies
        working-directory: modular-preview-src/experiments/modular-garden
        run: npm install --no-audit --no-fund
      - name: Gate preview on physical regression suite
        working-directory: modular-preview-src/experiments/modular-garden
        run: npm run check
      - name: Build separate WebGPU / WebGL2 experiment
        working-directory: modular-preview-src/experiments/modular-garden
        run: npm run build
      - name: Add experimental site alongside the unchanged existing routes
        run: |
          mkdir -p site/modular
          cp -R modular-preview-src/experiments/modular-garden/dist/. site/modular/
          test -s site/index.html
          test -s site/3d/index.html
          test -s site/modular/index.html
          grep -q '/marblebench-ios/modular/assets/' site/modular/index.html
          grep -q '3rd Person' site/modular/index.html
          grep -q '1st Person' site/modular/index.html
          find site/modular/assets -maxdepth 1 -name '*.js' -size +100k -print -quit | grep -q .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
