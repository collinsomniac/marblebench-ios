name: Deploy MarbleBench iOS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check existing 3D JavaScript module syntax
        run: |
          node --check site/3d/main.js
          node --check site/3d/physics.js
          node --check site/3d/render.js
      - name: Validate frame pacing diagnostic
        run: node tests/test_diagnostics.mjs
      - name: Validate quiet-water presentation
        run: node tests/test_presentation.mjs
      - name: Run original deterministic 3D physics regression
        run: node tests/test_3d.mjs
      - name: Verify original standalone and PWEB builds
        run: python3 tools/build_3d.py
      - name: Check out separate experimental branch without merging into main
        uses: actions/checkout@v4
        with:
          ref: e030e27daf674462f3ae5be048c74fa10ad9111f # preserve deployed modular revision
          path: modular-preview-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install modular experiment dependencies
        working-directory: modular-preview-src/experiments/modular-garden
        run: npm install --no-audit --no-fund
      - name: Gate preview on physical regression suite
        working-directory: modular-preview-src/experiments/modular-garden
        run: npm run check
      - name: Build separate WebGPU / WebGL2 experiment
        working-directory: modular-preview-src/experiments/modular-garden
        run: npm run build
      - name: Add experimental site alongside the unchanged existing routes
        run: |
          mkdir -p site/modular
          cp -R modular-preview-src/experiments/modular-garden/dist/. site/modular/
          test -s site/index.html
          test -s site/3d/index.html
          test -s site/modular/index.html
          test -s modular-preview-src/experiments/modular-garden/src/route-geometry.js
          grep -q 'DEFAULT_PACE=1.15' modular-preview-src/experiments/modular-garden/src/main.js
          grep -q '/marblebench-ios/modular/assets/' site/modular/index.html
          grep -q '3rd Person' site/modular/index.html
          grep -q '1st Person' site/modular/index.html
          find site/modular/assets -maxdepth 1 -name '*.js' -size +100k -print -quit | grep -q .
          printf '{"featureCommit":"%s","pagesWorkflowCommit":"%s"}\n' "$(git -C modular-preview-src rev-parse HEAD)" "$GITHUB_SHA" > site/modular/build-info.json
          cat site/modular/build-info.json
      - name: Check out validated toy redesign
        uses: actions/checkout@v4
        with:
          ref: 62b6b303d730f7a4add80d3f8457f268378a5f4b
          path: toy-preview-src
          persist-credentials: false
      - name: Test and build Marble Works
        working-directory: toy-preview-src/experiments/toy-run
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Add separate toy route and identify its source
        run: |
          mkdir -p site/toy
          cp -R toy-preview-src/experiments/toy-run/dist/. site/toy/
          test -s site/toy/index.html
          python3 - <<'PYINFO'
          import json, os, subprocess
          from pathlib import Path
          commit = subprocess.check_output(['git','-C','toy-preview-src','rev-parse','HEAD'],text=True).strip()
          Path('site/toy/build-info.json').write_text(json.dumps({'commit':commit,'pagesWorkflowCommit':os.environ['GITHUB_SHA']}))
          PYINFO
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
